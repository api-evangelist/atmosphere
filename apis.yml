aid: atmosphere
name: Atmosphere
description: >-
  Atmosphere (Atmosphere TV) is an Austin, Texas streaming television platform
  built for businesses rather than households. Spun out of Chive Media Group
  (theCHIVE) in 2019, it delivers free, ad-supported, audio-optional short-form
  channels - CHIVE TV, Atmosphere Sports, Happy TV, Nostalgia TV and partner
  channels - to bars, restaurants, gyms and health clubs, hotels, airports,
  medical waiting rooms, salons, casinos and other out-of-home venues over a
  streaming player and Android TV app. Alongside the channel lineup it sells a
  digital-signage product for venue-owned promotions, Atmosphere Trivia for
  in-venue engagement, a Business Manager mobile app for controlling screens,
  and an advertising network that monetizes those venue screens as connected-TV
  and digital-out-of-home inventory. Atmosphere raised a $65M Series D in
  February 2023 at a $1B valuation led by Sageview Capital with Valor Equity
  Partners and S3 Ventures. Atmosphere publishes no public developer API, SDK,
  or machine-readable API contract; api.atmosphere.tv is an undocumented
  first-party backend serving its own apps and venue console, and its shares
  trade on the private secondary market.
