method: probed
source: >-
  Contract discovery probes across www./api./help./admin./advertise.atmosphere.tv
  plus a search of atmosphere.tv, help.atmosphere.tv and the public web for any
  Atmosphere developer program.
summary: >-
  Atmosphere operates a first-party streaming and advertising platform with no
  public developer surface. There is no OpenAPI/Swagger, no GraphQL endpoint, no
  hosted MCP server, no A2A agent card, no published SDKs and no partner API
  program. api.atmosphere.tv is a live, undocumented backend for Atmosphere's own
  apps and venue console. Standards below are asserted only where they could be
  observed; everything unobservable is recorded as unknown rather than assumed.
standards:
- id: openapi
  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs,
    /docs, /redoc all return 404 on api.atmosphere.tv; www.atmosphere.tv/openapi.json
    returns 404. No spec found on the site, help centre, or any public repository.
- id: graphql
  conforms: false
  evidence: api.atmosphere.tv/graphql returns 404; no GraphQL surface documented.
- id: asyncapi
  conforms: false
  evidence: No event, streaming or webhook surface is documented for third parties.
- id: mcp
  conforms: false
